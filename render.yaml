# Render blueprint: one web service (API + UI + WebSockets) and one PostgreSQL database.
services:
  - type: web
    name: rescueplate
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rescueplate-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
databases:
  - name: rescueplate-db
    plan: free
